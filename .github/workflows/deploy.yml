# Redeploy the live site (https://getsendy.pages.dev) on every push to main, whoever pushed.
# Cloudflare Pages, free plan. Needs four repo secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN  — dash.cloudflare.com/profile/api-tokens, permission "Cloudflare Pages: Edit"
#   CLOUDFLARE_ACCOUNT_ID — shown on the Cloudflare dashboard home (right side)
#   VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY — same values as app/.env.local (baked in at build)
# Posts, clips and profiles live in Supabase, so moving hosts keeps all of them.
name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # also allow a manual run from the Actions tab

# One deploy at a time, newest wins: when two merges land close together, the older run is
# cancelled so it can't finish last and replace the newer site (happened with #32 / #33).
concurrency:
  group: deploy-production
  cancel-in-progress: true

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      # Makes the Pages project on the first run; afterwards it already exists and this fails harmlessly.
      - run: npx --yes wrangler@3 pages project create getsendy --production-branch=main || true
      - run: npx --yes wrangler@3 pages deploy dist --project-name=getsendy --branch=main
