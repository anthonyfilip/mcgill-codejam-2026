<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <title>Shotgun Tracker</title>
  <link rel="stylesheet" href="/src/live/style.css">
</head>
<body>
  <main>
    <nav class="tabs">
      <a href="/" class="active">Tracker</a>
      <a href="/feed.html">Feed</a>
    </nav>
    <div id="stage">
      <video id="video" playsinline muted></video>
      <canvas id="overlay"></canvas>
      <div id="timer">0.00</div>
      <div id="state">Tap Arm to start</div>
    </div>

    <div id="signals">
      <div class="sig" id="sig-crack">Crack</div>
      <div class="sig" id="sig-angle">Angle</div>
      <div class="sig" id="sig-mouth">Mouth</div>
      <div class="sig" id="sig-send">🤘 Send</div>
    </div>

    <button id="arm">Arm</button>

    <section id="results" hidden>
      <h2>Results</h2>
      <p>Time: <b id="r-time"></b> s</p>
      <!-- Hidden, not removed: the tracker still writes these and would crash without them. -->
      <p hidden>Max angle: <b id="r-max"></b>° · Avg angle: <b id="r-avg"></b>°</p>
      <p hidden>Started by: <b id="r-by"></b></p>
      <video id="replay" controls playsinline></video>
      <a id="download" download>Download clip</a>
      <div id="post-area" hidden>
        <textarea id="post-desc" maxlength="300" rows="3" placeholder="Say something about this one…"></textarea>
        <div id="post-count">0 / 300</div>
        <button id="post-feed">Post to feed</button>
      </div>
    </section>

    <pre id="debug"></pre>
    <p class="devlink"><a href="/lab.html">Detection lab (test on recorded clips) →</a></p>
  </main>
  <script type="module" src="/src/live/app.js"></script>
  <script type="module" src="/src/feed/share.ts"></script>
</body>
</html>
